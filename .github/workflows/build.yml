name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include: # macOS only (Godwit ADR 0033): elsewhere Google's server keeps its token in a plain file
          - runner: macos-15
            platform: darwin-arm64
          - runner: macos-15-intel
            platform: darwin-amd64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    env:
      CGO_ENABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Formatting
        run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test -race ./...
      - run: python scripts/package.py
      - uses: actions/upload-artifact@v4
        with:
          name: antigravity-${{ matrix.platform }}
          path: dist/antigravity/
          if-no-files-found: error

  # A v* tag publishes the bare libraries, named by platform, as the registry expects.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: The tag is plugin.json's version
        run: test "v$(jq -r .version plugin.json)" = "$GITHUB_REF_NAME"
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir out
          for d in dist/antigravity-*; do
            cp "$d/plugin.dylib" "out/antigravity-${d#dist/antigravity-}.dylib"
          done
          test "$(ls out | wc -l)" -eq 2
          cp plugin.json LICENSE out/
          (cd out && sha256sum * > SHA256SUMS)
          ls -l out
          gh release create "$GITHUB_REF_NAME" out/* --title "$GITHUB_REF_NAME" --notes "Antigravity for Godwit, macOS only. Read the README first: this may breach Google Antigravity's terms. Google's ACP server is downloaded from Google at sign-in, not shipped here."
